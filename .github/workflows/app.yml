name: app

# Builds the WayTV Settings APK (Rust NativeActivity, see app/) and publishes it.
#   push tag app-vN  -> versionCode N, versionName 1.N, GitHub Release "app-vN" with waytv-settings.apk
#   workflow_dispatch -> same build, APK only uploaded as a workflow artifact
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode for a manual build (versionName becomes 1.<code>)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: "27.3.13750724"
      CARGO_NDK_VERSION: "4.1.2"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724"

      - name: Rust + x86_64-linux-android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-linux-android
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}-ndk${{ env.NDK_VERSION }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "$CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
          fi
          cargo ndk --version

      - name: Unit tests (host)
        run: cargo test --locked

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == app-v* ]]; then
            code="${GITHUB_REF_NAME#app-v}"
          else
            code="${{ github.event.inputs.version_code }}"
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]] || [ "$code" -lt 1 ]; then
            echo "versionCode must be a positive integer, got '$code' (tag must look like app-v7)" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.$code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=1.$code"

      - name: Keystore
        env:
          WAYTV_KEYSTORE_B64: ${{ secrets.WAYTV_KEYSTORE_B64 }}
        run: |
          if [ -z "$WAYTV_KEYSTORE_B64" ]; then
            echo "secret WAYTV_KEYSTORE_B64 is missing" >&2
            exit 1
          fi
          printf '%s' "$WAYTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/waytv-release.jks"
          chmod 600 "$RUNNER_TEMP/waytv-release.jks"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          WAYTV_KEYSTORE_PASSWORD: ${{ secrets.WAYTV_KEYSTORE_PASSWORD }}
          WAYTV_KEY_ALIAS: ${{ secrets.WAYTV_KEY_ALIAS }}
          WAYTV_KEY_PASSWORD: ${{ secrets.WAYTV_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: "4"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export WAYTV_KEYSTORE="$RUNNER_TEMP/waytv-release.jks"
          OUT=build/waytv-settings.apk ./build-apk.sh
          rm -f "$WAYTV_KEYSTORE"

      - name: Check APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --min-sdk-version 24 --print-certs build/waytv-settings.apk | grep -v -i digest
          "$BT/aapt2" dump badging build/waytv-settings.apk | grep -E "^package|sdkVersion|native-code|launchable"
          "$BT/aapt2" dump badging build/waytv-settings.apk | grep -q "native-code: 'x86_64'"
          "$BT/aapt2" dump badging build/waytv-settings.apk | grep -q "versionCode='${{ steps.version.outputs.code }}'"
          sha256sum build/waytv-settings.apk | tee build/waytv-settings.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: waytv-settings-${{ steps.version.outputs.name }}
          path: |
            app/build/waytv-settings.apk
            app/build/waytv-settings.apk.sha256

      - name: GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/waytv-settings.apk build/waytv-settings.apk.sha256 \
              --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/waytv-settings.apk build/waytv-settings.apk.sha256 \
              -R "$GITHUB_REPOSITORY" \
              --title "WayTV Settings $VERSION_NAME" \
              --notes "WayTV Settings app $VERSION_NAME (versionCode ${TAG#app-v}). Install on the box with: sudo waytv-apps install waytv-settings.apk"
          fi
